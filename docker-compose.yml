services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: envisionstudio-dashboard
    container_name: envisionstudio_app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./database:/var/www/html/database
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
